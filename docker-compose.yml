services:
  mongo:
    image: mongo:4.2
    container_name: trading_mongo
    restart: unless-stopped
    ports:
      # The systemd-managed bot runs on the host. Keep Mongo private to it.
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - trading_net
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "mongo --quiet --eval \"db.adminCommand('ping').ok\" | grep 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Optional API/OAuth service. The trading bot is intentionally not run here.
  api:
    profiles: ["api"]
    build:
      context: .
    container_name: ctrader_api
    command: ["python3", "run.py"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - ${CTRADER_ENV_FILE:-.env}
    environment:
      MONGO_URI: mongodb://mongo:27017/ctrader_db
      CTRADER_LIVE_STATUS: "false"
    volumes:
      - ./src/data:/app/src/data
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - trading_net
    logging:
      driver: json-file
      options:
        max-size: 50m
        max-file: "3"

networks:
  trading_net:
    driver: bridge

volumes:
  mongo_data:
